# G0 deploy runtime config — mirrors unitree_rl_lab/deploy/robots/<robot>/config/policy/velocity/.../params/deploy.yaml
# Field names kept aligned with Unitree's schema so diffs are obvious.

robot_name: g0

# Path to the patched MJCF (sim2sim physics; on real robot this section is ignored).
mjcf_path: source/g0_robot_lab/g0_robot_lab/assets/robots/g0/mujoco/model_patched.xml
keyframe: default_stand

# Policy
policy:
  # onnx_path: deploy/robots/g0/config/policy/velocity/v0/policy.onnx
  onnx_path: logs/rsl_rl/g0_velocity/2026-05-26_18-36-57/exported/policy.onnx

# Time
step_dt: 0.02          # policy dt (s)
sim_dt:  0.002         # MJCF timestep override (None -> use MJCF default)
decimation: 10         # = step_dt / sim_dt

# Joint order used by the policy (SDK order = action order).
joint_names_sdk:
  - l_hip_pitch_joint
  - l_hip_roll_joint
  - l_hip_yaw_joint
  - l_knee_pitch_joint
  - l_ankle_pitch_joint
  - l_ankle_roll_joint
  - r_hip_pitch_joint
  - r_hip_roll_joint
  - r_hip_yaw_joint
  - r_knee_pitch_joint
  - r_ankle_pitch_joint
  - r_ankle_roll_joint
  - waist_yaw_joint
  - waist_roll_joint
  - l_shoulder_pitch_joint
  - l_shoulder_roll_joint
  - l_shoulder_yaw_joint
  - l_elbow_pitch_joint
  - r_shoulder_pitch_joint
  - r_shoulder_roll_joint
  - r_shoulder_yaw_joint
  - r_elbow_pitch_joint

# Joint order Isaac uses for the policy observation (jpos_rel / jvel_rel slot).
joint_names_isaac:
  - l_hip_pitch_joint
  - r_hip_pitch_joint
  - waist_yaw_joint
  - l_hip_roll_joint
  - r_hip_roll_joint
  - waist_roll_joint
  - l_hip_yaw_joint
  - r_hip_yaw_joint
  - l_shoulder_pitch_joint
  - r_shoulder_pitch_joint
  - l_knee_pitch_joint
  - r_knee_pitch_joint
  - l_shoulder_roll_joint
  - r_shoulder_roll_joint
  - l_ankle_pitch_joint
  - r_ankle_pitch_joint
  - l_shoulder_yaw_joint
  - r_shoulder_yaw_joint
  - l_ankle_roll_joint
  - r_ankle_roll_joint
  - l_elbow_pitch_joint
  - r_elbow_pitch_joint

# Default standing pose in SDK order (rad).
default_joint_pos:
  l_hip_pitch_joint:      -0.20
  l_hip_roll_joint:        0.0
  l_hip_yaw_joint:         0.0
  l_knee_pitch_joint:      0.34
  l_ankle_pitch_joint:    -0.14
  l_ankle_roll_joint:      0.0
  r_hip_pitch_joint:      -0.20
  r_hip_roll_joint:        0.0
  r_hip_yaw_joint:         0.0
  r_knee_pitch_joint:      0.34
  r_ankle_pitch_joint:    -0.14
  r_ankle_roll_joint:      0.0
  waist_yaw_joint:         0.0
  waist_roll_joint:        0.0
  l_shoulder_pitch_joint:  0.30
  l_shoulder_roll_joint:   0.25
  l_shoulder_yaw_joint:    0.0
  l_elbow_pitch_joint:    -0.97
  r_shoulder_pitch_joint:  0.30
  r_shoulder_roll_joint:  -0.25
  r_shoulder_yaw_joint:    0.0
  r_elbow_pitch_joint:    -0.97

# MIT-mode gains (kp on position error, kd on velocity error). SDK order.
stiffness:
  l_hip_pitch_joint: 4.0
  l_hip_roll_joint: 4.0
  l_hip_yaw_joint: 3.0
  l_knee_pitch_joint: 4.0
  l_ankle_pitch_joint: 4.0
  l_ankle_roll_joint: 4.5
  r_hip_pitch_joint: 4.0
  r_hip_roll_joint: 4.0
  r_hip_yaw_joint: 3.0
  r_knee_pitch_joint: 4.0
  r_ankle_pitch_joint: 4.0
  r_ankle_roll_joint: 4.5
  waist_yaw_joint: 2.0
  waist_roll_joint: 2.0
  l_shoulder_pitch_joint: 1.5
  l_shoulder_roll_joint: 1.5
  l_shoulder_yaw_joint: 1.5
  l_elbow_pitch_joint: 2.0
  r_shoulder_pitch_joint: 1.5
  r_shoulder_roll_joint: 1.5
  r_shoulder_yaw_joint: 1.5
  r_elbow_pitch_joint: 2.0

damping:
  l_hip_pitch_joint: 0.18
  l_hip_roll_joint: 0.16
  l_hip_yaw_joint: 0.10
  l_knee_pitch_joint: 0.26
  l_ankle_pitch_joint: 0.22
  l_ankle_roll_joint: 0.15
  r_hip_pitch_joint: 0.18
  r_hip_roll_joint: 0.16
  r_hip_yaw_joint: 0.10
  r_knee_pitch_joint: 0.26
  r_ankle_pitch_joint: 0.22
  r_ankle_roll_joint: 0.15
  waist_yaw_joint: 0.08
  waist_roll_joint: 0.08
  l_shoulder_pitch_joint: 0.06
  l_shoulder_roll_joint: 0.06
  l_shoulder_yaw_joint: 0.06
  l_elbow_pitch_joint: 0.08
  r_shoulder_pitch_joint: 0.06
  r_shoulder_roll_joint: 0.06
  r_shoulder_yaw_joint: 0.06
  r_elbow_pitch_joint: 0.08

# JointPositionAction
actions:
  joint_pos:
    scale: 0.12
    use_default_offset: true

# Commands (velocity)
commands:
  base_velocity:
    default: [0.0, 0.0, 0.0]   # vx, vy, wz
    ranges:
      vx: [-0.8, 0.8]
      vy: [-0.5, 0.5]
      wz: [-1.5, 1.5]

# Observation manager — per-term, scale + history. Order MUST match training config.
observations:
  enable_corruption: false   # at deploy time, no noise injection
  history_length: 5
  terms:
    - name: base_ang_vel
      dim: 3
      scale: 0.2
    - name: projected_gravity
      dim: 3
      scale: 1.0
    - name: velocity_commands
      dim: 3
      scale: 1.0
    - name: joint_pos_rel
      dim: 22
      scale: 1.0
    - name: joint_vel_rel
      dim: 22
      scale: 0.05
    - name: last_action
      dim: 22
      scale: 1.0
    - name: gait_phase
      dim: 2
      scale: 1.0
      period_s: 0.8

# FixStand: how long to ramp from current q -> default_joint_pos
fix_stand:
  ramp_time_s: 1.5

# Elastic band (optional, for sim2sim staging)
elastic_band:
  enabled: false
  anchor: [0.0, 0.0, 2.0]
  stiffness: 50.0
  damping: 10.0
  rest_length: 0.0     # auto-calibrated by FixStand once ramp completes
  one_sided: true      # only pull when stretch > L_rest (catch-on-fall, feet stay loaded)
  # mode:
  #   rope     — Unitree default: pull toward anchor (tilts when robot tips sideways)
  #   world_up — always world +Z; use if you want vertical lift even when torso rolls
  mode: rope

# Keyboard bindings (state transitions are gated — see fsm/ctrl_fsm.py)
keys:
  passive:    "p"
  fix_stand:  "f"
  rl_base:    "r"
  zero_cmd:   "0"
  vx_up:      "w"
  vx_down:    "s"
  vy_left:    "a"
  vy_right:   "d"
  wz_left:    "q"
  wz_right:   "e"
